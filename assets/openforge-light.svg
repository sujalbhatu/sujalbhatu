<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" fill="none">
<style>
.serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.ink { fill: #1f2328; } .sub { fill: #59636e; } .mute { fill: #8c959f; }
.acc { fill: #e8590c; } .grn { fill: #1a7f37; }
/* every element's resting state is the finished picture; motion is only added on top,
   so renderers that don't animate (mobile app, previews) still show everything */
.rise { }
.pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; } @keyframes grow { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect x="0.5" y="0.5" width="999" height="469" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<g class="rise">
  <rect x="36" y="43" width="9" height="9" fill="#e8590c"/>
  <text x="54" y="52" class="mono ink" font-size="12.5" font-weight="600" letter-spacing="2.4">OPENFORGE</text>
  <circle class="pulse" cx="156" cy="48" r="4" fill="#1a7f37"/><text x="166" y="52" class="mono grn" font-size="11.5">live</text>
  <text x="34" y="104" class="serif ink" font-size="34" letter-spacing="-.6">Indian law, answered from the statute.</text>
  <text x="36" y="140" class="sans sub" font-size="15">Ask in plain words, in any of 14 Indian languages. It answers from 123 Acts</text>
  <text x="36" y="162" class="sans sub" font-size="15">and cites the exact section, or says it doesn't know.</text>
</g>
