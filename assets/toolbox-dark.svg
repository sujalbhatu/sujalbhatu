y="192" class="sans ink" font-size="14">scikit-learn</text></g><g class="rise" style="animation-delay:0.32s"><text x="796" y="62" class="mono acc" font-size="11" font-weight="600" letter-spacing="2">SHIPPING</text><text x="796" y="96" class="sans ink" font-size="14">Linux · systemd</text><text x="796" y="120" class="sans ink" font-size="14">Nginx</text><text x="796" y="144" class="sans ink" font-size="14">Docker</text><text x="796" y="168" class="sans ink" font-size="14">GitHub Actions</text><text x="796" y="192" class="sans ink" font-size="14">k6 load tests</text></g>
