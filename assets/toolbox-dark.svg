<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none">
<style>
.serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.ink { fill: #e6edf3; } .sub { fill: #9da7b3; } .mute { fill: #6e7681; }
.acc { fill: #ff7a45; } .grn { fill: #3fb950; }
/* every element's resting state is the finished picture; motion is only added on top,
   so renderers that don't animate (mobile app, previews) still show everything */
.rise { }
.pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="999" height="229" rx="14" fill="#0d1117" stroke="#30363d"/>
