<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="60%" stop-color="#241e4e"/>
      <stop offset="100%" stop-color="#302b63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .h { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; fill: #a78bfa; }
    .t { font-size: 15px; fill: #e2e0f5; }
    .b { font-weight: 700; fill: #ffffff; }
    .chip { font-size: 13px; fill: #ddd6fe; font-weight: 600; }
    .line { opacity: 0; animation: fade .6s ease-out forwards; }
    .d1 { animation-delay: .10s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .40s; }
    .d4 { animation-delay: .55s; } .d5 { animation-delay: .70s; } .d6 { animation-delay: .85s; }
    .d7 { animation-delay: 1.0s; } .d8 { animation-delay: 1.15s; }
    @keyframes fade { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  </style>

  <rect width="880" height="330" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="880" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Left panel: about -->
  <rect x="20" y="22" width="410" height="206" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.22"/>
  <text x="42" y="54" class="h">ABOUT ME</text>
  <g class="line d1"><text x="42" y="90" class="t">🎓  CSE at <tspan class="b">NIT Jamshedpur</tspan>, class of 2027</text></g>
  <g class="line d2"><text x="42" y="124" class="t">🛠️  I build backends that survive real traffic</text></g>
  <g class="line d3"><text x="42" y="158" class="t">🔬  Research on <tspan class="b">brain-computer interfaces</tspan></text></g>
  <g class="line d4"><text x="42" y="192" class="t">🤝  Mentor rural kids for Navodaya exams</text></g>

  <!-- Right panel: now -->
  <rect x="450" y="22" width="410" height="206" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#22d3ee" stroke-opacity="0.22"/>
  <circle cx="478" cy="49" r="5" fill="#22c55e" class="pulse"/>
  <text x="492" y="54" class="h" style="fill:#22d3ee">RIGHT NOW</text>
  <g class="line d5"><text x="472" y="90" class="t">🚀  Running <tspan class="b">OpenForge</tspan> + <tspan class="b">CampusTrack</tspan> live</text></g>
  <g class="line d6"><text x="472" y="124" class="t">📄  First paper under review at Springer</text></g>
  <g class="line d7"><text x="472" y="158" class="t">🧩  600+ DSA problems in C++, still going</text></g>
  <g class="line d8"><text x="472" y="192" class="t">🎯  Open to <tspan class="b">SDE roles</tspan></text></g>

  <!-- Bottom strip: ask me about -->
  <text x="42" y="282" class="h">ASK ME ABOUT</text>
  <g class="line d8">
    <rect x="190" y="261" width="150" height="30" rx="15" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="265" y="281" class="chip" text-anchor="middle">SSE vs WebSockets</text>
    <rect x="352" y="261" width="186" height="30" rx="15" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="445" y="281" class="chip" text-anchor="middle">Why your RAG hallucinates</text>
    <rect x="550" y="261" width="134" height="30" rx="15" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="617" y="281" class="chip" text-anchor="middle">Docker + Nginx</text>
    <rect x="696" y="261" width="146" height="30" rx="15" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="769" y="281" class="chip" text-anchor="middle">EEG + graph nets</text>
  </g>
</svg>
