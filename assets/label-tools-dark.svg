<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" fill="none">
<style>
.serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.ink { fill: #e6edf3; } .sub { fill: #9da7b3; } .mute { fill: #6e7681; }
.acc { fill: #ff7a45; } .grn { fill: #3fb950; }
/* every element's resting state is the finished picture; motion is only added on top,
   so renderers that don't animate (mobile app, previews) still show everything */
.rise { }
.pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<text x="2" y="40" class="mono acc" font-size="13" font-weight="600" letter-spacing="2">03</text>
<text x="40" y="40" class="mono ink" font-size="13" font-weight="600" letter-spacing="3">TOOLBOX</text>
<line x1="133" y1="35.5" x2="998" y2="35.5" stroke="#30363d"/>


</svg>
