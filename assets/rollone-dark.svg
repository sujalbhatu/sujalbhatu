<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" fill="none">
<style>
.serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.ink { fill: #e6edf3; } .sub { fill: #9da7b3; } .mute { fill: #6e7681; }
.acc { fill: #ff7a45; } .grn { fill: #3fb950; }
/* every element's resting state is the finished picture; motion is only added on top,
   so renderers that don't animate (mobile app, previews) still show everything */
.rise { }
.pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; } @keyframes grow { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect x="0.5" y="0.5" width="999" height="469" rx="14" fill="#0d1117" stroke="#30363d"/>
<g class="rise">
  <rect x="36" y="43" width="9" height="9" fill="#ff7a45"/>
  <text x="54" y="52" class="mono ink" font-size="12.5" font-weight="600" letter-spacing="2.4">ROLLONE · CAMPUSTRACK</text>
  <circle class="pulse" cx="272" cy="48" r="4" fill="#3fb950"/><text x="282" y="52" class="mono grn" font-size="11.5">live</text>
  <text x="34" y="104" class="serif ink" font-size="28.1" letter-spacing="-.6">Roll-call in under 25 seconds, not 10 minutes.</text>
  <text x="36" y="140" class="sans sub" font-size="15">QR attendance nobody can proxy from the canteen: tokens that die every</text>
  <text x="36" y="162" class="sans sub" font-size="15">4 s, a 35 m geofence and a face check, for a whole lecture hall at once.</text>
</g>
<line x1="620" y1="96" x2="620" y2="390" stroke="#30363d"/>
<text x="650" y="104" class="mono mute" font-size="11" letter-spacing="1.6">MEASURED</text>

  <text x="650" y="128" class="sans sub" font-size="12.5">Median scan, QR to marked</text>
  <text x="950" y="128" class="mono ink" font-size="13" font-weight="600" text-anchor="end"><tspan class="mute" font-weight="400">— → </tspan><tspan class="grn">0.7 s</tspan></text>
  <rect x="650" y="139" width="300" height="6" rx="3" fill="#161b22"/>
  <rect x="650" y="139" width="0.0" height="6" rx="3" fill="#6e7681" opacity=".55"/>
  <rect class="bar" style="animation-delay:0.40s" x="650" y="152" width="21.0" height="6" rx="3" fill="#3fb950"/>
  <rect x="650" y="152" width="300" height="6" rx="3" fill="none"/>
  <text x="650" y="194" class="sans sub" font-size="12.5">Errors under load (k6)</text>
  <text x="950" y="194" class="mono ink" font-size="13" font-weight="600" text-anchor="end"><tspan class="mute" font-weight="400">— → </tspan><tspan class="grn">0%</tspan></text>
  <rect x="650" y="205" width="300" height="6" rx="3" fill="#161b22"/>
  <rect x="650" y="205" width="0.0" height="6" rx="3" fill="#6e7681" opacity=".55"/>
  <rect class="bar" style="animation-delay:0.65s" x="650" y="218" width="3.6" height="6" rx="3" fill="#3fb950"/>
  <rect x="650" y="218" width="300" height="6" rx="3" fill="none"/>
  <text x="650" y="260" class="sans sub" font-size="12.5">Face check, per face</text>
  <text x="950" y="260" class="mono ink" font-size="13" font-weight="600" text-anchor="end"><tspan class="mute" font-weight="400">145 ms → </tspan><tspan class="grn">66 ms</tspan></text>
  <rect x="650" y="271" width="300" height="6" rx="3" fill="#161b22"/>
  <rect x="650" y="271" width="300.0" height="6" rx="3" fill="#6e7681" opacity=".55"/>
  <rect class="bar" style="animation-delay:0.90s" x="650" y="284" width="136.5" height="6" rx="3" fill="#3fb950"/>
  <rect x="650" y="284" width="300" height="6" rx="3" fill="none"/>
  <text x="650" y="326" class="sans sub" font-size="12.5">Upload per camera frame</text>
  <text x="950" y="326" class="mono ink" font-size="13" font-weight="600" text-anchor="end"><tspan class="mute" font-weight="400">2.4 MB → </tspan><tspan class="grn">15 KB</tspan></text>
  <rect x="650" y="337" width="300" height="6" rx="3" fill="#161b22"/>
  <rect x="650" y="337" width="300.0" height="6" rx="3" fill="#6e7681" opacity=".55"/>
  <rect class="bar" style="animation-delay:1.15s" x="650" y="350" width="9.0" height="6" rx="3" fill="#3fb950"/>
  <rect x="650" y="350" width="300" height="6" rx="3" fill="none"/>
<g class="rise" style="animation-delay:.2s"><circle r="4" fill="#ff7a45"><animateMotion dur="3.2s" repeatCount="indefinite" path="M85.5,227.0 L545.5,227.0" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle>
  <rect x="36" y="204" width="99" height="46" rx="8" fill="#0d1117"/>
  <rect x="36" y="204" width="99" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="85.5" y="223" class="sans ink" font-size="12.5" font-weight="600" text-anchor="middle">Phone</text>
  <text x="85.5" y="239" class="mono sub" font-size="10.5" text-anchor="middle">camera · GPS</text>
  <rect x="151" y="204" width="99" height="46" rx="8" fill="#0d1117"/>
  <rect x="151" y="204" width="99" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="200.5" y="223" class="sans ink" font-size="12.5" font-weight="600" text-anchor="middle">QR token</text>
  <text x="200.5" y="239" class="mono sub" font-size="10.5" text-anchor="middle">HMAC · 4 s</text>
  <rect x="266" y="204" width="99" height="46" rx="8" fill="#0d1117"/>
  <rect x="266" y="204" width="99" height="46" rx="8" fill="rgba(255,122,69,0.16)" stroke="#ff7a45"/>
  <text x="315.5" y="223" class="sans ink" font-size="12.5" font-weight="600" text-anchor="middle">API</text>
  <text x="315.5" y="239" class="mono sub" font-size="10.5" text-anchor="middle">Node · Redis</text>
  <rect x="381" y="204" width="99" height="46" rx="8" fill="#0d1117"/>
  <rect x="381" y="204" width="99" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="430.5" y="223" class="sans ink" font-size="12.5" font-weight="600" text-anchor="middle">Face check</text>
  <text x="430.5" y="239" class="mono sub" font-size="10.5" text-anchor="middle">batched</text>
  <rect x="496" y="204" width="99" height="46" rx="8" fill="#0d1117"/>
  <rect x="496" y="204" width="99" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="545.5" y="223" class="sans ink" font-size="12.5" font-weight="600" text-anchor="middle">Postgres</text>
  <text x="545.5" y="239" class="mono sub" font-size="10.5" text-anchor="middle">Neon</text><line x1="135" y1="227.0" x2="151" y2="227.0" stroke="#30363d" stroke-width="1.5"/><path d="M145,223.0 L151,227.0 L145,231.0" stroke="#6e7681" stroke-width="1.5" fill="none"/><line x1="250" y1="227.0" x2="266" y2="227.0" stroke="#30363d" stroke-width="1.5"/><path d="M260,223.0 L266,227.0 L260,231.0" stroke="#6e7681" stroke-width="1.5" fill="none"/><line x1="365" y1="227.0" x2="381" y2="227.0" stroke="#30363d" stroke-width="1.5"/><path d="M375,223.0 L381,227.0 L375,231.0" stroke="#6e7681" stroke-width="1.5" fill="none"/><line x1="480" y1="227.0" x2="496" y2="227.0" stroke="#30363d" stroke-width="1.5"/><path d="M490,223.0 L496,227.0 L490,231.0" stroke="#6e7681" stroke-width="1.5" fill="none"/>
  <line x1="315.5" y1="250" x2="315.5" y2="276" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="240.5" y="276" width="150" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="315.5" y="293" class="sans ink" font-size="12" font-weight="600" text-anchor="middle">Live roster</text>
  <text x="315.5" y="307" class="mono sub" font-size="10" text-anchor="middle">Redis pub/sub</text></g>
<line x1="36" y1="398" x2="964" y2="398" stroke="#30363d"/>
<rect x="36" y="418" width="59" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="66" y="434" class="mono sub" font-size="11.5" text-anchor="middle">React</text><rect x="103.0" y="418" width="52" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="129" y="434" class="mono sub" font-size="11.5" text-anchor="middle">Node</text><rect x="162.6" y="418" width="96" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="211" y="434" class="mono sub" font-size="11.5" text-anchor="middle">PostgreSQL</text><rect x="266.6" y="418" width="59" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="296" y="434" class="mono sub" font-size="11.5" text-anchor="middle">Redis</text><rect x="333.6" y="418" width="66" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="367" y="434" class="mono sub" font-size="11.5" text-anchor="middle">Python</text><rect x="408.0" y="418" width="74" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="445" y="434" class="mono sub" font-size="11.5" text-anchor="middle">FaceNet</text><rect x="489.8" y="418" width="37" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="508" y="434" class="mono sub" font-size="11.5" text-anchor="middle">k6</text><rect x="534.6" y="418" width="66" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="568" y="434" class="mono sub" font-size="11.5" text-anchor="middle">Docker</text><rect x="609.0" y="418" width="59" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="638" y="434" class="mono sub" font-size="11.5" text-anchor="middle">Nginx</text>

